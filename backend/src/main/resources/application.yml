server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: lims-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lims}
    username: ${DB_USERNAME:lims}
    password: ${DB_PASSWORD:lims_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

lims:
  security:
    jwt:
      issuer: ${JWT_ISSUER:lims-internal}
      secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
      access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:3600}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

