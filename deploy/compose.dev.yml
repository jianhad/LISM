services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lims}
      POSTGRES_USER: ${DB_USERNAME:-lims}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lims_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lims} -d ${DB_NAME:-lims}"]
      interval: 5s
      timeout: 3s
      retries: 10

